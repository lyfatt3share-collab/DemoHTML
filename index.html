<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WASHFLOW DEMO</title>
    <!-- ✅ 统一使用相对路径，避免 GitHub Pages 子目录 404 -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
    <style>
        /* 确保卡片链接不显示下划线，继承文字颜色 */
        a.role-card {
            text-decoration: none;
            color: inherit;
            display: block;
            cursor: pointer;
        }
    </style>
</head>
<body x-data="{ lang: localStorage.getItem('lang') || 'zh' }">
    <div style="text-align:center; margin: 40px 0 32px;">
        <div class="logo">🚗 WASHFLOW</div>
        <span style="color:var(--text-secondary); font-size:14px; margin-top:8px; display:block;">DEMO MODE</span>
        <p style="color:var(--text-secondary); font-size:12px; margin-top:4px;">选择角色（仅用于流程与权限演示）</p>
    </div>

    <!-- ✅ 改用原生 <a> 标签，100% 可靠跳转，不依赖 JS -->
    <div class="role-grid">
        <a href="dashboard.html?role=guest" class="card role-card">
            <span class="role-icon">👤</span>
            <strong>Guest</strong>
            <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">体验用户</div>
        </a>
        <a href="dashboard.html?role=sale" class="card role-card">
            <span class="role-icon">💼</span>
            <strong>Sale</strong>
            <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">销售顾问</div>
        </a>
        <a href="dashboard.html?role=worker" class="card role-card">
            <span class="role-icon">🔧</span>
            <strong>Worker</strong>
            <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">洗车技师</div>
        </a>
        <a href="dashboard.html?role=admin" class="card role-card">
            <span class="role-icon">⚙️</span>
            <strong>Admin</strong>
            <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">系统管理</div>
        </a>
    </div>

    <div style="text-align:center; margin-top:32px;">
        <button class="btn btn-outline" style="width:auto; padding:8px 16px;" @click="lang = lang==='zh'?'en':'ms'; localStorage.setItem('lang', lang); window.location.reload();">
            🌐 <span x-text="lang.toUpperCase()"></span>
        </button>
    </div>

    <!-- PWA Service Worker 注册 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW注册失败:', err));
            });
        }
    </script>
</body>
</html>
