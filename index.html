<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WASHFLOW DEMO</title>
    <!-- ✅ 统一使用相对路径，避免 GitHub Pages 子目录 404 -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
    <style>
        /* 确保卡片链接不显示下划线，继承文字颜色 */
        a.role-card {
            text-decoration: none;
            color: inherit;
            display: block;
            cursor: pointer;
        }
    </style>
</head>
<body x-data="{ lang: localStorage.getItem('lang') || 'zh' }">
    <div style="text-align:center; margin: 40px 0 32px;">
        <div class="logo">🚗 WASHFLOW</div>
        <span style="color:var(--text-secondary); font-size:14px; margin-top:8px; display:block;">DEMO MODE</span>
        <p style="color:var(--text-secondary); font-size:12px; margin-top:4px;">选择角色（仅用于流程与权限演示）</p>
    </div>

    <!-- ✅ 改用原生 <a> 标签，100% 可靠跳转，不依赖 JS -->
    <div class="role-grid">
        <a href="dashboard.html?role=guest" class="card role-card">
            <span class="role-icon">👤</span>
            <strong>Guest</strong>
            <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">体验用户</div>
        </a>
        <a href="dashboard.html?role=sale" class="card role-card">
            <span class="role-icon">💼</span>
            <strong>Sale</strong>
            <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">销售顾问</div>
        </a>
        <a href="dashboard.html?role=worker" class="card role-card">
            <span class="role-icon">🔧</span>
            <strong>Worker</strong>
            <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">洗车技师</div>
        </a>
        <a href="dashboard.html?role=admin" class="card role-card">
            <span class="role-icon">⚙️</span>
            <strong>Admin</strong>
            <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">系统管理</div>
        </a>
    </div>

    <div style="text-align:center; margin-top:32px;">
        <!-- 语言选择器 -->
        <div x-data="{ open: false }" class="dropdown" style="display:inline-block; position:relative;">
            <button class="lang-btn" @click="open = !open" :class="{ 'active': open }">
                🌐 <span x-text="lang.toUpperCase()"></span>
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="margin-left:6px;" :style="{ transform: open ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.2s' }">
                    <path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div x-show="open" 
                 @click.away="open = false"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 translate-y-2 scale-95"
                 x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                 x-transition:leave-end="opacity-0 translate-y-2 scale-95"
                 class="lang-dropdown">
                <button @click="setLang('zh'); open = false" 
                        class="lang-option"
                        :class="{ 'active': lang === 'zh' }">
                    <span class="lang-flag">🇨🇳</span>
                    <span class="lang-name">中文</span>
                    <span class="lang-code">ZH</span>
                </button>
                <button @click="setLang('en'); open = false" 
                        class="lang-option"
                        :class="{ 'active': lang === 'en' }">
                    <span class="lang-flag">🇬🇧</span>
                    <span class="lang-name">English</span>
                    <span class="lang-code">EN</span>
                </button>
                <button @click="setLang('ms'); open = false" 
                        class="lang-option"
                        :class="{ 'active': lang === 'ms' }">
                    <span class="lang-flag">🇲🇾</span>
                    <span class="lang-name">Bahasa Melayu</span>
                    <span class="lang-code">MS</span>
                </button>
            </div>
        </div>
    </div>

    <style>
        .lang-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .lang-btn:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(6, 182, 212, 0.15);
        }
        .lang-btn.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }
        
        .lang-dropdown {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.08);
            min-width: 180px;
            z-index: 1000;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }
        
        .lang-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 10px 14px;
            background: none;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
        }
        .lang-option:hover {
            background: var(--bg-page);
        }
        .lang-option.active {
            background: var(--primary-light);
            color: var(--primary);
        }
        .lang-option:not(:last-child) {
            border-bottom: 1px solid var(--border);
        }
        
        .lang-flag {
            font-size: 18px;
            margin-right: 10px;
        }
        .lang-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
        }
        .lang-code {
            font-size: 11px;
            padding: 2px 6px;
            background: var(--bg-tertiary, #F1F5F9);
            border-radius: 4px;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .lang-option.active .lang-code {
            background: var(--primary);
            color: white;
        }
    </style>

    <script>
        function setLang(newLang) {
            localStorage.setItem('lang', newLang);
            window.location.reload();
        }
    </script>

    <!-- PWA Service Worker 注册 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW注册失败:', err));
            });
        }
    </script>
</body>
</html>
