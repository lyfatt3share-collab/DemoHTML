<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>销售报表</title>

    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
    <style>
        .header-lang-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
        .header-lang-wrap .lang-dropdown {
            bottom: auto;
            top: calc(100% + 8px);
            left: auto;
            right: 0;
            transform: none;
        }
        .header-lang-btn {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 16px;
            border: none;
            background: transparent;
            color: var(--text-primary);
        }
        .header-lang-btn:hover { background: var(--bg-page); }
    </style>
</head>

<body x-data="reportData()" x-init="guard(); initReport()" style="padding-bottom:80px;">

    <!-- Header -->
    <div class="header">
        <button class="btn btn-outline"
                style="width:auto; padding:6px 10px;"
                @click="goDashboard()">
            ←
        </button>
        <strong x-text="t('reportHeading')"></strong>
        <div style="display:flex; gap:8px; align-items:center;">
            <div class="header-lang-wrap">
                <button type="button"
                        class="header-lang-btn nav-lang-btn"
                        @click="langOpen = !langOpen"
                        :aria-expanded="langOpen">
                    🌐
                    <svg width="8" height="8" viewBox="0 0 12 12" fill="none" :style="{ transform: langOpen ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.2s' }">
                        <path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <div x-show="langOpen"
                     @click.away="langOpen = false"
                     x-transition
                     class="lang-dropdown">
                    <button type="button" @click="switchLang('zh'); langOpen = false"
                            class="lang-option"
                            :class="{ 'active': lang === 'zh' }">
                        <span class="lang-flag">🇨🇳</span>
                        <span class="lang-name">中文</span>
                        <span class="lang-code">ZH</span>
                    </button>
                    <button type="button" @click="switchLang('en'); langOpen = false"
                            class="lang-option"
                            :class="{ 'active': lang === 'en' }">
                        <span class="lang-flag">🇬🇧</span>
                        <span class="lang-name">English</span>
                        <span class="lang-code">EN</span>
                    </button>
                    <button type="button" @click="switchLang('ms'); langOpen = false"
                            class="lang-option"
                            :class="{ 'active': lang === 'ms' }">
                        <span class="lang-flag">🇲🇾</span>
                        <span class="lang-name">Bahasa Melayu</span>
                        <span class="lang-code">MS</span>
                    </button>
                </div>
            </div>
            <span class="tag pending" x-text="t('roleAdminBadge')"></span>
        </div>
    </div>

    <!-- 时间与视图选择 -->
    <div class="card">
        <div style="display:flex; gap:8px; margin-bottom:12px;">
            <button class="btn btn-outline" :class="{ 'primary': view==='day' }" @click="setView('day')" x-text="t('viewDay')"></button>
            <button class="btn btn-outline" :class="{ 'primary': view==='week' }" @click="setView('week')" x-text="t('viewWeek')"></button>
            <button class="btn btn-outline" :class="{ 'primary': view==='month' }" @click="setView('month')" x-text="t('viewMonth')"></button>
        </div>

        <input type="date" class="form-input" x-model="selectedDate" @change="loadReport()" />
    </div>

    <!-- 核心指标 -->
    <div class="card">
        <h2 style="font-size:24px;">
            RM <span x-text="summary.totalSales.toFixed(2)"></span>
        </h2>

        <p style="color:var(--text-secondary);">
            <span x-text="periodLabel"></span><span x-text="t('salesSuffix')"></span>
        </p>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;">
            <div>
                <p style="font-size:13px;" x-text="t('summaryCompleted')"></p>
                <strong x-text="summary.completedOrders"></strong>
            </div>
            <div>
                <p style="font-size:13px;" x-text="t('summaryException')"></p>
                <strong :style="summary.exceptionOrders > 0 ? 'color:var(--status-exception)' : ''"
                        x-text="summary.exceptionOrders">
                </strong>
            </div>
        </div>

        <div style="margin-top:12px;">
            <span :style="trendDirection === 'up'
          ? 'color:var(--status-ready)'
          : trendDirection === 'down'
          ? 'color:var(--status-exception)'
          : ''"
                  x-text="trendText">
            </span>
        </div>

        <!-- 去 ledger -->
        <div style="margin-top:16px;">
            <button class="btn btn-outline" style="width:100%;" @click="goLedger()" x-text="t('openLedger')">
            </button>
        </div>
    </div>

    <!-- Alpine -->
    <script>
        function reportData() {
            return {
                lang: localStorage.getItem('lang') || 'zh',
                langOpen: false,
                role: new URLSearchParams(location.search).get('role'),

                view: 'day',
                selectedDate: '',
                summary: {
                    totalSales: 0,
                    completedOrders: 0,
                    exceptionOrders: 0,
                },
                trendDirection: 'flat',
                trendText: '',
                periodLabel: '',

                i18n: {
                    zh: {
                        pageTitle: 'WASHFLOW — 销售报表',
                        reportHeading: '销售报表',
                        viewDay: '日',
                        viewWeek: '周',
                        viewMonth: '月',
                        salesSuffix: '销售额',
                        summaryCompleted: '完成订单',
                        summaryException: '异常订单',
                        trendUp: '↑ 较上一周期增长',
                        trendDown: '↓ 较上一周期下降',
                        trendFlat: '≈ 与上一周期持平',
                        openLedger: '查看当日交易明细',
                        roleAdminBadge: '管理员',
                        periodToday: '今天',
                        periodWeek: '本周',
                        periodMonth: '本月',
                    },
                    en: {
                        pageTitle: 'WASHFLOW — Sales Report',
                        reportHeading: 'Sales Report',
                        viewDay: 'Day',
                        viewWeek: 'Week',
                        viewMonth: 'Month',
                        salesSuffix: ' sales',
                        summaryCompleted: 'Completed orders',
                        summaryException: 'Exception orders',
                        trendUp: '↑ Up vs previous period',
                        trendDown: '↓ Down vs previous period',
                        trendFlat: '≈ Flat vs previous period',
                        openLedger: 'View daily transaction details',
                        roleAdminBadge: 'Admin',
                        periodToday: 'Today',
                        periodWeek: 'This week',
                        periodMonth: 'This month',
                    },
                    ms: {
                        pageTitle: 'WASHFLOW — Laporan Jualan',
                        reportHeading: 'Laporan Jualan',
                        viewDay: 'Hari',
                        viewWeek: 'Minggu',
                        viewMonth: 'Bulan',
                        salesSuffix: ' jualan',
                        summaryCompleted: 'Pesanan selesai',
                        summaryException: 'Pesanan luar biasa',
                        trendUp: '↑ Naik berbanding tempoh lepas',
                        trendDown: '↓ Turun berbanding tempoh lepas',
                        trendFlat: '≈ Rata berbanding tempoh lepas',
                        openLedger: 'Lihat butiran transaksi harian',
                        roleAdminBadge: 'Pentadbir',
                        periodToday: 'Hari ini',
                        periodWeek: 'Minggu ini',
                        periodMonth: 'Bulan ini',
                    },
                },

                t(key) {
                    return this.i18n[this.lang]?.[key] || key;
                },

                setLang(lang) {
                    this.lang = lang;
                    localStorage.setItem('lang', lang);
                },

                switchLang(lang) {
                    this.setLang(lang);
                    window.location.reload();
                },

                guard() {
                    if (this.role !== 'admin') {
                        window.location.replace('./dashboard.html');
                    }
                },

                initReport() {
                    document.documentElement.lang = this.lang;
                    document.title = this.t('pageTitle');
                    this.selectedDate = new Date().toISOString().slice(0, 10);
                    this.loadReport();
                },

                setView(v) {
                    this.view = v;
                    this.loadReport();
                },

                loadReport() {
                    this.periodLabel =
                        this.view === 'day' ? this.t('periodToday') :
                            this.view === 'week' ? this.t('periodWeek') : this.t('periodMonth');

                    this.summary.totalSales = Math.random() * 5000 + 1000;
                    this.summary.completedOrders = Math.floor(Math.random() * 30 + 10);
                    this.summary.exceptionOrders = Math.floor(Math.random() * 3);

                    const trend = Math.random();
                    if (trend > 0.66) {
                        this.trendDirection = 'up';
                        this.trendText = this.t('trendUp');
                    } else if (trend < 0.33) {
                        this.trendDirection = 'down';
                        this.trendText = this.t('trendDown');
                    } else {
                        this.trendDirection = 'flat';
                        this.trendText = this.t('trendFlat');
                    }
                },

                goLedger() {
                    window.location.href = `./ledger.html?role=${this.role}`;
                },

                goDashboard() {
                    window.location.href = `./dashboard.html?role=${this.role}`;
                },
            };
        }
    </script>
</body>
</html>
