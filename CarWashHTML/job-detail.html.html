<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="app"></main>

<script src="js/store.js"></script>
<script>
const p = new URLSearchParams(location.search);
const job = Store.getJob(p.get("id"));
const role = p.get("role");
const app = document.getElementById("app");

if (job.status === "CREATED" && role === "worker") {
  app.innerHTML = `
    <h3>Inspection</h3>
    <label><input type="checkbox"> Accept order</label><br/>
    <label><input type="checkbox"> Existing damage</label><br/>
    <label><input type="checkbox"> Loose parts</label><br/>
    <label><input type="checkbox"> Heavy dirt</label><br/>
    <button class="btn primary" onclick="next()">Start Washing</button>
  `;
}

function next(){
  job.status = "READY_TO_PICKUP";
  location.href = "dashboard.html?role=worker";
}
</script>
</body>
</html>
``
