<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
</head>
<body x-data="dashboardData"
      x-init="initDashboard()">
    <!-- 离线提示 -->
    <div class="offline-banner" x-show="!isOnline" x-text="t('offline')"></div>

    <!-- 顶部栏 -->
    <div class="header">
        <div class="logo"> WASHFLOW</div>
        <div style="display:flex; gap:8px; align-items:center;">
            <span class="tag pending" style="background:var(--primary-light); color:var(--primary); border:1px solid var(--primary);" x-text="role.toUpperCase()"></span>
            <button class="btn btn-outline" style="width:auto; padding:6px 10px;" onclick="window.location.href='/'">🔙</button>
        </div>
    </div>

    <!-- 菜单导航 -->
    <nav style="display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:16px;">
        <a href="job/create.html" class="btn btn-outline" style="width:auto; white-space:nowrap;" x-show="['guest','sale','admin'].includes(role)">➕ <span x-text="t('create')"></span></a>
        <button class="btn btn-outline" style="width:auto; white-space:nowrap;" @click="showSearch = !showSearch">🔍 <span x-text="t('search')"></span></button>
        <button class="btn btn-outline" style="width:auto; white-space:nowrap;" x-show="role==='admin'"> <span x-text="t('report')"></span></button>
    </nav>

    <!-- 搜索框 -->
    <div x-show="showSearch" style="margin-bottom:16px;" x-transition>
        <input type="text" 
               x-model="searchQuery"
               :placeholder="t('searchPlaceholder')"
               style="width:100%; padding:12px; border:1px solid var(--border); border-radius:8px; font-size:14px; outline:none;"
               @input="filterJobs()">
        
        <!-- 搜索历史 -->
        <div x-show="searchHistory.length > 0 && searchQuery === ''" style="margin-top:8px;">
            <p style="font-size:12px; color:var(--text-secondary); margin-bottom:4px;" x-text="t('recentSearches')"></p>
            <div style="display:flex; flex-wrap:wrap; gap:6px;">
                <template x-for="(item, index) in searchHistory" :key="index">
                    <span @click="searchQuery = item; filterJobs()"
                          style="background:var(--bg-tertiary); padding:4px 10px; border-radius:12px; font-size:12px; cursor:pointer; border:1px solid var(--border);"
                          x-text="item"></span>
                </template>
                <button @click="clearHistory()" 
                        style="background:transparent; padding:4px 10px; border-radius:12px; font-size:12px; cursor:pointer; color:var(--danger); border:1px solid var(--danger);"
                        x-text="t('clearHistory')"></button>
            </div>
        </div>
        
        <!-- 搜索结果计数 -->
        <div x-show="searchQuery.trim() !== ''" style="margin-top:8px; font-size:12px; color:var(--text-secondary);">
            <span x-text="filteredJobs.length + ' / ' + jobs.length + ' ' + t('results')"></span>
        </div>
    </div>

    <!-- 任务列表 -->
    <template x-for="job in filteredJobs" :key="job.id">
        <div class="card" @click="window.location.href=`/job/detail.html?id=${job.id}&role=${role}`">
            <div style="display:flex; justify-content:space-between; align-items:start;">
                <div style="width: 85%;">
                    <h3 style="font-size:18px; margin-bottom:4px;">🚗 <span x-text="job.plate"></span></h3>
                    <p style="color:var(--text-secondary); font-size:14px;">
                        <span x-text="job.model"></span> · <span x-text="job.color"></span>
                    </p>

                    <!-- ✅ 新增：车主信息 -->
                    <p style="color:var(--text-secondary); font-size:13px; margin-top:4px; display:flex; align-items:center; gap:4px;">
                        <span> <span x-text="job.ownerName"></span></span>
                        <span style="margin:0 4px;">·</span>
                        <span>📞 <span x-text="job.ownerPhone"></span></span>
                    </p>
                </div>
                <span class="tag" :class="job.status" x-text="t(job.status)"></span>
            </div>
            <div style="margin-top:12px; font-size:13px; color:var(--text-secondary);">
                ID: <span x-text="job.id"></span>
            </div>
        </div>
    </template>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item active">🏠 <span x-text="t('dashboard')"></span></div>
        <div class="nav-item">📋 <span x-text="t('report')"></span></div>
        <!-- 语言选择器 -->
        <div class="nav-item lang-nav-item" style="position:relative;">
            <span @click="langOpen = !langOpen" class="lang-nav-btn" :class="{ 'active': langOpen }">
                🌐 <span x-text="lang.toUpperCase()"></span>
                <svg width="10" height="10" viewBox="0 0 12 12" fill="none" style="margin-left:4px;" :style="{ transform: langOpen ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.2s' }">
                    <path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <div x-show="langOpen" 
                 @click.away="langOpen = false"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 translate-y-2 scale-95"
                 x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                 x-transition:leave-end="opacity-0 translate-y-2 scale-95"
                 class="lang-dropdown">
                <button @click="switchLang('zh'); langOpen = false" 
                        class="lang-option"
                        :class="{ 'active': lang === 'zh' }">
                    <span class="lang-flag">🇨🇳</span>
                    <span class="lang-name">中文</span>
                    <span class="lang-code">ZH</span>
                </button>
                <button @click="switchLang('en'); langOpen = false" 
                        class="lang-option"
                        :class="{ 'active': lang === 'en' }">
                    <span class="lang-flag">🇬🇧</span>
                    <span class="lang-name">English</span>
                    <span class="lang-code">EN</span>
                </button>
                <button @click="switchLang('ms'); langOpen = false" 
                        class="lang-option"
                        :class="{ 'active': lang === 'ms' }">
                    <span class="lang-flag">🇲🇾</span>
                    <span class="lang-name">Bahasa Melayu</span>
                    <span class="lang-code">MS</span>
                </button>
            </div>
        </div>
        <div class="nav-item">👤 <span x-text="role"></span></div>
    </div>

    <style>
        .lang-nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-nav-btn:hover {
            background: var(--bg-page);
            color: var(--primary);
        }
        .lang-nav-btn.active {
            background: var(--primary-light);
            color: var(--primary);
        }
        
        .lang-dropdown {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.08);
            min-width: 180px;
            z-index: 1000;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }
        
        .lang-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 10px 14px;
            background: none;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
        }
        .lang-option:hover {
            background: var(--bg-page);
        }
        .lang-option.active {
            background: var(--primary-light);
            color: var(--primary);
        }
        .lang-option:not(:last-child) {
            border-bottom: 1px solid var(--border);
        }
        
        .lang-flag {
            font-size: 18px;
            margin-right: 10px;
        }
        .lang-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
        }
        .lang-code {
            font-size: 11px;
            padding: 2px 6px;
            background: var(--bg-tertiary, #F1F5F9);
            border-radius: 4px;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .lang-option.active .lang-code {
            background: var(--primary);
            color: white;
        }
    </style>

    <!-- 核心数据与逻辑 -->
    <script>
    function dashboardData() {
      return {
        lang: localStorage.getItem('lang') || 'zh',
        role: new URLSearchParams(window.location.search).get('role') || 'guest',
        isOnline: navigator.onLine,
        showSearch: false,
        searchQuery: '',
        searchHistory: JSON.parse(localStorage.getItem('searchHistory') || '[]'),
        langOpen: false,

        // ✅ 数据已更新：加入 ownerName 和 ownerPhone
        jobs: [
          { id: 'J001', plate: 'B 1234 ABC', model: 'Honda City', color: 'White', ownerName: 'Tan Ah Kow', ownerPhone: '012-345 6789', status: 'inspection' },
          { id: 'J002', plate: 'W 5678 XYZ', model: 'Perodua Myvi', color: 'Blue', ownerName: 'Lee Mei Ling', ownerPhone: '016-987 6543', status: 'pending' },
          { id: 'J003', plate: 'V 9012 DEF', model: 'Tesla Model 3', color: 'Black', ownerName: 'Raj Kumar', ownerPhone: '011-222 3344', status: 'washing' }
        ],

        get filteredJobs() {
          if (!this.searchQuery.trim()) {
            return this.jobs;
          }
          const query = this.searchQuery.toLowerCase();
          const results = this.jobs.filter(job => 
            job.plate.toLowerCase().includes(query) ||
            job.ownerName.toLowerCase().includes(query) ||
            job.id.toLowerCase().includes(query) ||
            job.model.toLowerCase().includes(query) ||
            job.color.toLowerCase().includes(query)
          );
          
          // Save to history when user searches
          if (query.length > 0 && !this.searchHistory.includes(this.searchQuery.trim())) {
            this.searchHistory.unshift(this.searchQuery.trim());
            if (this.searchHistory.length > 5) {
              this.searchHistory.pop();
            }
            localStorage.setItem('searchHistory', JSON.stringify(this.searchHistory));
          }
          
          return results;
        },

        filterJobs() {
          // Alpine.js will automatically re-render based on filteredJobs computed property
        },
        
        clearHistory() {
          this.searchHistory = [];
          localStorage.removeItem('searchHistory');
        },

        i18n: {
          zh: { dashboard: '仪表盘', create: '创建订单', search: '搜索', searchPlaceholder: '🔍 搜索车牌/车主/工单号...', recentSearches: '最近搜索', clearHistory: '清除历史', results: '条结果', report: '报表', logout: '退出', plate: '车牌', submit: '提交订单', inspection: '检查中', washing: '清洗中', ready: '可提车', completed: '已完成', exception: '异常', startWash: '开始清洗', pay: '立即支付', acknowledge: '确认提车', offline: '离线模式 - 恢复网络后同步' },
          en: { dashboard: 'Dashboard', create: 'Create Job', search: 'Search', searchPlaceholder: '🔍 Search by plate/owner/job ID...', recentSearches: 'Recent Searches', clearHistory: 'Clear History', results: 'results', report: 'Report', logout: 'Logout', plate: 'Plate', submit: 'Submit', inspection: 'Inspection', washing: 'Washing', ready: 'Ready', completed: 'Completed', exception: 'Exception', startWash: 'Start Wash', pay: 'Pay Now', acknowledge: 'Acknowledge', offline: 'Offline Mode - Sync on reconnect' },
          ms: { dashboard: 'Papan Pemuka', create: 'Cipta Tempahan', search: 'Carian', searchPlaceholder: '🔍 Cari plat/pemilik/ID pekerjaan...', recentSearches: 'Carian Terkini', clearHistory: 'Kosongkan Sejarah', results: 'hasil', report: 'Laporan', logout: 'Log Keluar', plate: 'Plat', submit: 'Hantar', inspection: 'Pemeriksaan', washing: 'Sedang Dicuci', ready: 'Sedia Diambil', completed: 'Selesai', exception: 'Kecualian', startWash: 'Mula Cuci', pay: 'Bayar', acknowledge: 'Sahkan', offline: 'Mod Luar Talian - Sync bila sambung' }
        },

        initDashboard() {
          window.addEventListener('online', () => this.isOnline = true);
          window.addEventListener('offline', () => this.isOnline = false);
        },

        t(key) {
          return this.i18n[this.lang]?.[key] || key;
        },

        switchLang(lang) {
          this.lang = lang;
          localStorage.setItem('lang', lang);
          window.location.reload();
        }
      }
    }
    </script>
</body>
</html>
