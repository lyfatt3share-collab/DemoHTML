<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>任务详情</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.6.1/dist/css/tom-select.default.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.6.1/dist/js/tom-select.complete.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
    <style>
        .inspect-row { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .inspect-row:last-of-type { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .inspect-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
        .inspect-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .inspect-sub { font-size: 12px; color: var(--text-secondary); }
        .badge-issue { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: #FEE2E2; color: #B91C1C; }
        .alert-block { background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; border-radius: var(--radius-sm); padding: 12px; font-size: 13px; line-height: 1.5; margin-top: 12px; }
        .hint-muted { font-size: 12px; color: var(--text-secondary); margin-top: 8px; line-height: 1.5; }
        .note-item { background: var(--bg-page); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
        .note-meta { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
        .inspect-photo-input { margin-top: 8px; font-size: 13px; max-width: 100%; }
        .inspect-photo-list { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
        .inspect-photo-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px; background: var(--bg-page); border-radius: var(--radius-sm); border: 1px solid var(--border); }
        .inspect-photo-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; flex-shrink: 0; border: 1px solid var(--border); }
        .inspect-photo-meta { flex: 1; min-width: 0; font-size: 13px; line-height: 1.45; }
        .inspect-photo-name { font-weight: 500; word-break: break-all; }
        .inspect-photo-size { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .inspect-photo-remove { flex-shrink: 0; font-size: 12px; padding: 6px 10px; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="detailData()" x-init="initDetail(); document.documentElement.lang = lang; document.title = t('pageTitle')" style="padding-bottom:100px;">
    <!-- 顶部栏 -->
    <div class="header">
        <button class="btn btn-outline" style="width:auto; padding:6px 10px;" @click="goDashboard()">←</button>
        <strong x-text="t('detailTitle')"></strong>
        <span class="tag" :class="status" x-text="t(status)"></span>
    </div>

    <!-- ✅ 任务信息卡片 -->
    <div class="card">
        <!-- 服务日期时间 -->
        <p style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;">
            📅 <span x-text="job.serviceDateTime"></span>
        </p>

        <h2 style="margin-bottom:6px;">
            🚗 <span x-text="job.vehicleIdentifier"></span>
            <span style="font-size:12px; font-weight:400; color:var(--text-secondary);" x-text="job.vehicleType === 'chassis' ? '(Chassis)' : ''"></span>
        </h2>

        <p style="color:var(--text-secondary); margin-bottom:6px;">
            <span x-text="job.model"></span>
            · <span x-text="job.type"></span>
        </p>

        <p style="font-size:13px; color:var(--text-secondary);">
            <span x-text="t('jobIdLabel')"></span><strong x-text="job.id"></strong>
        </p>

        <!-- Outlet -->
        <p style="font-size:13px; color:var(--text-secondary); margin-top:6px;">
            📍 <span x-text="t('outletLabel')"></span><strong x-text="getOutletName(job.outlet)"></strong>
        </p>

        <!-- Sales Advisor + Phone -->
        <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
            <div style="font-size:14px;">
                💼 <span x-text="t('salesAdvisorLabel')"></span><strong x-text="job.salesAdvisor || t('dash')"></strong>
            </div>

            <a :href="'tel:' + job.ownerPhone"
               style="color:var(--primary); font-size:14px; font-weight:500; text-decoration:none;">
                📞 <span x-text="job.ownerPhone"></span>
            </a>
        </div>

        <!-- Services -->
        <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--border);">
            <p style="font-size:13px; font-weight:500; margin-bottom:6px;" x-text="t('servicesLabel')"></p>
            <div style="display:flex; flex-wrap:wrap; gap:6px;">
                <template x-for="code in job.services" :key="code">
                    <span style="display:inline-block; padding:3px 8px; border-radius:4px; font-size:12px; background:var(--primary-light); color:var(--primary); border:1px solid var(--primary);" x-text="getServiceName(code)"></span>
                </template>
            </div>
        </div>

        <template x-if="job.remark">
            <div style="margin-top:12px; font-size:13px; color:var(--text-secondary);">
                📝 <span x-text="t('remarkPrefix')"></span><span x-text="job.remark"></span>
            </div>
        </template>

        <!-- Vehicle Photos -->
        <div x-show="job.photos && job.photos.length > 0" style="margin-top:12px; padding-top:10px; border-top:1px solid var(--border);">
            <p style="font-size:13px; font-weight:500; margin-bottom:8px;" x-text="t('photosLabel')"></p>
            <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap:8px;">
                <template x-for="(photo, idx) in job.photos" :key="idx">
                    <div style="position:relative;">
                        <img :src="photo.url" :alt="photo.caption || ''" style="width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:6px; border:1px solid var(--border); cursor:pointer;" @click="openPhoto(photo.url)">
                        <span x-show="photo.caption" style="position:absolute; bottom:4px; left:4px; right:4px; font-size:10px; background:rgba(0,0,0,0.6); color:white; padding:2px 4px; border-radius:3px; text-align:center; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;" x-text="photo.caption"></span>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- 洗前阶段：非工人只读 -->
    <template x-if="role !== 'worker' && isPreWashPhase()">
        <div class="card">
            <h3 style="margin-bottom:8px;" x-text="t('prewashTitle')"></h3>
            <p style="font-size:14px; color:var(--text-secondary); line-height:1.6;" x-text="t('prewashBody')"></p>
            <p class="hint-muted" x-show="status === 'pending'" x-text="t('prewashHintPending')"></p>
            <p class="hint-muted" x-show="status === 'inspection'" x-text="t('prewashHintInspection')"></p>
        </div>
    </template>

    <!-- Worker: 车辆检查 / Vehicle inspection（pending 或 inspection） -->
    <template x-if="role === 'worker' && isPreWashPhase()">
        <div class="card">
            <div class="inspect-head" style="margin-bottom:12px;">
                <div>
                    <h3 class="inspect-title" style="font-size:16px;" x-text="t('inspectTitle')"></h3>
                    <p class="inspect-sub" x-text="t('inspectSub')"></p>
                </div>
            </div>

            <!-- 划痕 / 凹痕 -->
            <div class="inspect-row">
                <div class="inspect-head">
                    <span class="inspect-title" x-text="t('inspectScratches')"></span>
                    <span class="badge-issue" x-show="inspection.scratches === 'needs_confirmation'" x-text="t('badgeNeedsConfirm')"></span>
                </div>
                <select class="form-select" x-model="inspection.scratches">
                    <option value="" x-text="t('selectPlaceholder')"></option>
                    <option value="none_or_minor" x-text="t('scratchOptNone')"></option>
                    <option value="documented_ok" x-text="t('scratchOptDocumented')"></option>
                    <option value="needs_confirmation" x-text="t('scratchOptConfirm')"></option>
                </select>
            </div>

            <!-- 油污 -->
            <div class="inspect-row">
                <div class="inspect-head">
                    <span class="inspect-title" x-text="t('inspectGrease')"></span>
                    <span class="badge-issue" x-show="inspection.grease === 'heavy'" x-text="t('badgeHeavy')"></span>
                </div>
                <select class="form-select" x-model="inspection.grease">
                    <option value="" x-text="t('selectPlaceholder')"></option>
                    <option value="light" x-text="t('greaseOptLight')"></option>
                    <option value="medium" x-text="t('greaseOptMedium')"></option>
                    <option value="heavy" x-text="t('greaseOptHeavy')"></option>
                </select>
            </div>

            <!-- 内饰 -->
            <div class="inspect-row">
                <div class="inspect-head">
                    <span class="inspect-title" x-text="t('inspectInterior')"></span>
                    <span class="badge-issue" x-show="inspection.interior === 'poor'" x-text="t('badgeNeedsConfirm')"></span>
                </div>
                <select class="form-select" x-model="inspection.interior">
                    <option value="" x-text="t('selectPlaceholder')"></option>
                    <option value="good" x-text="t('interiorOptGood')"></option>
                    <option value="fair" x-text="t('interiorOptFair')"></option>
                    <option value="poor" x-text="t('interiorOptPoor')"></option>
                </select>
            </div>

            <!-- 车内物品 -->
            <div class="inspect-row">
                <div class="inspect-head">
                    <span class="inspect-title" x-text="t('inspectBelongings')"></span>
                    <span class="badge-issue" x-show="inspection.belongings === 'issue'" x-text="t('badgeNeedsConfirm')"></span>
                </div>
                <select class="form-select" x-model="inspection.belongings">
                    <option value="" x-text="t('selectPlaceholder')"></option>
                    <option value="none_visible" x-text="t('belongingsOptNone')"></option>
                    <option value="customer_notified" x-text="t('belongingsOptNotified')"></option>
                    <option value="issue" x-text="t('belongingsOptIssue')"></option>
                </select>
            </div>

            <!-- 照片上传（多选） -->
            <div class="inspect-row">
                <div class="inspect-head">
                    <span class="inspect-title" x-text="t('inspectPhotos')"></span>
                </div>
                <label style="display:block; font-size:13px; font-weight:500; margin-bottom:6px;" x-text="t('uploadPhotosLabel')"></label>
                <input type="file"
                       class="inspect-photo-input"
                       accept="image/*"
                       multiple
                       @change="addInspectionPhotos($event)">
                <p class="hint-muted" style="margin-top:8px;" x-text="t('inspectPhotoDemoHint')"></p>
                <template x-if="inspectionPhotos.length === 0">
                    <p class="hint-muted" style="margin-top:6px;" x-text="t('inspectPhotoEmptyHint')"></p>
                </template>
                <div class="inspect-photo-list" x-show="inspectionPhotos.length > 0">
                    <template x-for="(p, idx) in inspectionPhotos" :key="p.id">
                        <div class="inspect-photo-row">
                            <img class="inspect-photo-thumb" :src="p.previewUrl" :alt="p.name">
                            <div class="inspect-photo-meta">
                                <div class="inspect-photo-name" x-text="p.name"></div>
                                <div class="inspect-photo-size">
                                    <span x-text="formatFileSize(p.size)"></span>
                                    <span x-show="p.type"> · </span>
                                    <span x-text="p.type"></span>
                                </div>
                                <div class="hint-muted" style="margin-top:6px; font-size:11px;" x-text="p.demoBinaryNote"></div>
                            </div>
                            <button type="button"
                                    class="btn btn-outline inspect-photo-remove"
                                    @click="removeInspectionPhoto(idx)"
                                    x-text="t('removePhoto')">
                            </button>
                        </div>
                    </template>
                </div>
            </div>

            <!-- 整体异常 -->
            <div class="form-group" style="margin-top:8px; margin-bottom:0;">
                <label style="display:flex; gap:10px; align-items:center; font-size:14px; cursor:pointer;">
                    <input type="checkbox" x-model="inspection.overallAbnormal">
                    <span x-text="t('overallAbnormalLabel')"></span>
                </label>
            </div>

            <!-- 备注列表 -->
            <div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--border);">
                <label class="form-group" style="margin-bottom:8px;">
                    <span style="display:block; margin-bottom:6px; font-weight:500; font-size:14px;" x-text="t('notesLabel')"></span>
                    <textarea class="form-textarea" rows="2" x-model="noteDraft" :placeholder="t('notePlaceholder')"></textarea>
                </label>
                <button type="button" class="btn btn-outline" style="width:auto; padding:8px 14px; margin-bottom:12px;" @click="addNote()" x-text="t('addNote')"></button>
                <template x-if="workerNotes.length === 0">
                    <p class="hint-muted" x-text="t('noWorkerNotes')"></p>
                </template>
                <template x-for="(n, idx) in workerNotes" :key="idx">
                    <div class="note-item">
                        <div class="note-meta" x-text="n.author + ' · ' + n.time"></div>
                        <div x-text="n.text"></div>
                    </div>
                </template>
            </div>

            <!-- 异常提示 -->
            <div class="alert-block" x-show="hasInspectionAbnormal()" x-cloak>
                <strong x-text="t('alertCannotWashTitle')"></strong><br>
                <span x-text="t('alertCannotWashBody')"></span>
            </div>

            <p class="hint-muted" x-show="!inspectionComplete() && !hasInspectionAbnormal()" x-text="t('hintFinishInspectionPhotos')"></p>
            <p class="hint-muted" x-show="inspectionComplete() && !hasInspectionAbnormal()" x-text="t('hintInspectionOk')"></p>

            <button type="button"
                    class="btn btn-outline"
                    style="margin-top:12px; border-color:#FECACA; color:#B91C1C;"
                    x-show="hasInspectionAbnormal()"
                    @click="requestManagerConfirmation()"
                    x-text="t('requestManagerBtn')">
            </button>
            <p class="hint-muted" x-show="managerConfirmRequested" style="color:var(--status-inspection);" x-text="t('managerRequestedHint')"></p>

            <button type="button"
                    class="btn"
                    style="margin-top:12px;"
                    :disabled="!canStartWash()"
                    :title="washBlockedReason()"
                    @click="status = 'washing'"
                    x-text="t('startWashBtn')">
            </button>
            <p class="hint-muted" x-show="!canStartWash() && inspectionComplete()" x-text="washBlockedReason()"></p>
        </div>
    </template>

    <!-- 🔵 清洗中 -->
    <template x-if="status === 'washing'">
        <div class="card">
            <div style="text-align:center;">
                <div style="font-size:40px; margin:20px 0;">💧</div>
                <h3 x-text="t('washingTitle')"></h3>
            </div>

            <template x-if="role === 'worker'">
                <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
                    <label class="form-group" style="margin-bottom:8px;">
                        <span style="display:block; margin-bottom:6px; font-weight:500; font-size:14px;" x-text="t('parkingLabel')"></span>
                        <input type="text"
                               class="form-input"
                               x-model="parkingBayNote"
                               :placeholder="t('parkingPlaceholder')">
                    </label>
                    <p class="hint-muted" x-text="t('parkingHint')"></p>
                    <button type="button"
                            class="btn"
                            style="margin-top:16px; width:100%;"
                            :disabled="!canCompleteWashTask()"
                            :title="completeWashBlockedReason()"
                            @click="completeWashTask()"
                            x-text="t('completeWashBtn')">
                    </button>
                    <p class="hint-muted" style="margin-top:8px;" x-show="!canCompleteWashTask()" x-text="completeWashBlockedReason()"></p>
                </div>
            </template>

            <template x-if="role !== 'worker'">
                <p class="hint-muted" style="text-align:center; margin-top:16px;" x-text="t('nonWorkerWashingHint')"></p>
            </template>
        </div>
    </template>

    <!-- 🟢 可提车（无付款步骤；销售在此确认提车） -->
    <template x-if="status === 'ready'">
        <div class="card">
            <h3 style="color:var(--status-ready);" x-text="t('readyTitle')"></h3>
            <p class="hint-muted" style="margin-top:8px;" x-text="t('readySubtitle')"></p>

            <div class="note-item" style="margin-top:12px;" x-show="washSummaryVisible()">
                <div class="note-meta" x-text="t('handoverMeta')"></div>
                <div><strong x-text="t('parkingKey')"></strong><span x-text="parkingBayNote || t('dash')"></span></div>
                <div style="margin-top:6px;"><strong x-text="t('washCompletedKey')"></strong><span x-text="washCompletedAt || t('dash')"></span></div>
            </div>

            <template x-if="role === 'sale' || role === 'admin'">
                <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
                    <h3 style="margin-bottom:8px; font-size:16px;" x-text="t('pickupTitle')"></h3>
                    <div style="background:var(--bg-page); padding:12px; border-radius:8px; margin:12px 0; font-size:14px; line-height:1.6;" x-text="t('pickupBody')"></div>
                    <label style="display:flex; gap:8px; margin-bottom:8px;"><input type="checkbox" x-model="ackChecked"> <span x-text="t('pickupCheckbox')"></span></label>
                    <p class="hint-muted"
                       style="margin:8px 0 12px; padding:10px 12px; background:var(--primary-light); border-radius:8px; border:1px solid var(--primary); color:var(--text-primary); line-height:1.55;"
                       x-show="ackChecked"
                       x-text="t('pickupInvoiceThanks')"></p>
                    <button type="button" class="btn" :disabled="!ackChecked" @click="status='completed'" x-text="t('pickupConfirmBtn')"></button>
                </div>
            </template>

            <template x-if="role === 'worker'">
                <p class="hint-muted" style="margin-top:12px;" x-text="t('workerWaitSaleHint')"></p>
            </template>
        </div>
    </template>

    <!-- 兼容旧演示链接：曾付款状态并入「可提车」逻辑，此处引导销售在同一界面确认 -->
    <template x-if="status === 'paid'">
        <div class="card">
            <h3 style="color:var(--status-ready);" x-text="t('readyTitle')"></h3>
            <p class="hint-muted" x-text="t('paidLegacyHint')"></p>
            <div class="note-item" style="margin-top:12px;" x-show="washSummaryVisible()">
                <div class="note-meta" x-text="t('handoverMeta')"></div>
                <div><strong x-text="t('parkingKey')"></strong><span x-text="parkingBayNote || t('dash')"></span></div>
                <div style="margin-top:6px;"><strong x-text="t('washCompletedKey')"></strong><span x-text="washCompletedAt || t('dash')"></span></div>
            </div>
            <template x-if="role === 'sale' || role === 'admin'">
                <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
                    <h3 style="margin-bottom:8px; font-size:16px;" x-text="t('pickupTitle')"></h3>
                    <label style="display:flex; gap:8px; margin-bottom:8px;"><input type="checkbox" x-model="ackChecked"> <span x-text="t('pickupCheckbox')"></span></label>
                    <p class="hint-muted"
                       style="margin:8px 0 12px; padding:10px 12px; background:var(--primary-light); border-radius:8px; border:1px solid var(--primary); color:var(--text-primary); line-height:1.55;"
                       x-show="ackChecked"
                       x-text="t('pickupInvoiceThanks')"></p>
                    <button type="button" class="btn" :disabled="!ackChecked" @click="status='completed'" x-text="t('pickupConfirmBtn')"></button>
                </div>
            </template>
        </div>
    </template>

    <!-- ✅ 已完成 -->
    <template x-if="status === 'completed'">
        <div class="card" style="text-align:center; border:2px solid var(--status-completed);">
            <div style="font-size:40px; margin:20px 0;">🎉</div>
            <h3 style="color:var(--status-completed);" x-text="t('completedTitle')"></h3>
            <div class="note-item" style="margin-top:12px; text-align:left;" x-show="washSummaryVisible()">
                <div class="note-meta" x-text="t('handoverMeta')"></div>
                <div><strong x-text="t('parkingKey')"></strong><span x-text="parkingBayNote || t('dash')"></span></div>
                <div style="margin-top:6px;"><strong x-text="t('washCompletedKey')"></strong><span x-text="washCompletedAt || t('dash')"></span></div>
            </div>
            <button type="button" class="btn btn-outline" style="margin-top:16px;" @click="goDashboard()" x-text="t('backDashboard')"></button>
        </div>
    </template>

    <!-- 🧠 数据与逻辑 -->
    <script>
        const OUTLETS = {
            puchong: 'Puchong',
            selayang: 'Selayang',
            ampang: 'Ampang'
        };

        const SERVICE_MAP = {
            '1': 'Basic',
            '2': 'Premium (water wax)',

        };

        const MOCK_JOB_MAP = {

                services: ['1', '2'],
                photos: [
                    { url: 'https://via.placeholder.com/300x200/E2E8F0/64748B?text=Front', caption: 'Front' },
                    { url: 'https://via.placeholder.com/300x200/E2E8F0/64748B?text=Rear', caption: 'Rear' }
                ],
                status: 'inspection'
            },

                photos: [
                    { url: 'https://via.placeholder.com/300x200/E2E8F0/64748B?text=Side', caption: 'Side' }
                ],
                status: 'pending'

        function detailData() {
            return {
                lang: localStorage.getItem('lang') || 'zh',
                role: new URLSearchParams(location.search).get('role') || 'guest',
                status: 'inspection',
                job: { ...MOCK_JOB_MAP.J001 },
                i18n: DETAIL_I18N,

                inspection: {
                    scratches: '',
                    grease: '',
                    interior: '',
                    belongings: '',
                    overallAbnormal: false
                },

                inspectionPhotos: [],

                workerNotes: [],
                noteDraft: '',
                managerConfirmRequested: false,

                parkingBayNote: '',
                washCompletedAt: '',

                ackChecked: false,

                t(key) {
                    return this.i18n[this.lang]?.[key] || key;
                },

                getOutletName(code) {
                    return OUTLETS[code] || code || this.t('dash');
                },

                getServiceName(code) {
                    return SERVICE_MAP[code] || code;
                },

                openPhoto(url) {
                    window.open(url, '_blank');
                },

                localeForDates() {
                    if (this.lang === 'en') return 'en-US';
                    if (this.lang === 'ms') return 'ms-MY';
                    return 'zh-CN';
                },

                washSummaryVisible() {
                    return !!(String(this.parkingBayNote || '').trim() || String(this.washCompletedAt || '').trim());
                },

                canCompleteWashTask() {
                    return this.role === 'worker' && String(this.parkingBayNote || '').trim().length > 0;
                },

                completeWashBlockedReason() {
                    if (this.role !== 'worker') return '';
                    if (!String(this.parkingBayNote || '').trim()) return this.t('completeWashNeedParking');
                    return '';
                },

                completeWashTask() {
                    if (!this.canCompleteWashTask()) return;
                    const now = new Date();
                    this.washCompletedAt = now.toLocaleString(this.localeForDates(), { hour12: false });
                    this.parkingBayNote = String(this.parkingBayNote || '').trim();
                    this.status = 'ready';
                },

                isPreWashPhase() {
                    return this.status === 'pending' || this.status === 'inspection';
                },

                hasInspectionAbnormal() {
                    if (this.inspection.overallAbnormal) return true;
                    if (this.inspection.scratches === 'needs_confirmation') return true;
                    if (this.inspection.grease === 'heavy') return true;
                    if (this.inspection.interior === 'poor') return true;
                    if (this.inspection.belongings === 'issue') return true;
                    return false;
                },

                inspectionComplete() {
                    const i = this.inspection;
                    const hasPhotos = Array.isArray(this.inspectionPhotos) && this.inspectionPhotos.length >= 1;
                    return !!(i.scratches && i.grease && i.interior && i.belongings && hasPhotos);
                },

                formatFileSize(bytes) {
                    const n = Number(bytes);
                    if (!Number.isFinite(n) || n < 0) return this.t('dash');
                    if (n < 1024) return n + ' B';
                    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
                    return (n / (1024 * 1024)).toFixed(1) + ' MB';
                },

                revokeAllInspectionPhotoUrls() {
                    (this.inspectionPhotos || []).forEach((p) => {
                        if (p && p.previewUrl) URL.revokeObjectURL(p.previewUrl);
                    });
                },

                addInspectionPhotos(event) {
                    const input = event.target;
                    const files = Array.from(input.files || []).filter((f) => f.type.startsWith('image/'));
                    input.value = '';
                    const uid = () => (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : 'p-' + Date.now() + '-' + Math.random().toString(36).slice(2));
                    files.forEach((file) => {
                        const previewUrl = URL.createObjectURL(file);
                        this.inspectionPhotos.push({
                            id: uid(),
                            name: file.name,
                            type: file.type,
                            size: file.size,
                            previewUrl,
                            file,
                            demoBinaryNote: this.t('inspectPhotoDemoNote')
                        });
                    });
                },

                removeInspectionPhoto(index) {
                    const item = this.inspectionPhotos[index];
                    if (item && item.previewUrl) URL.revokeObjectURL(item.previewUrl);
                    this.inspectionPhotos.splice(index, 1);
                },

                resetInspectionPhotos() {
                    this.revokeAllInspectionPhotoUrls();
                    this.inspectionPhotos = [];
                },

                canStartWash() {
                    return this.inspectionComplete() && !this.hasInspectionAbnormal();
                },

                washBlockedReason() {
                    const i = this.inspection;
                    const selectsOk = !!(i.scratches && i.grease && i.interior && i.belongings);
                    if (!selectsOk) return this.t('washBlocked_selects');
                    if (!this.inspectionPhotos.length) return this.t('washBlocked_photos');
                    if (this.hasInspectionAbnormal()) return this.t('washBlocked_abnormal');
                    return '';
                },

                addNote() {
                    const text = (this.noteDraft || '').trim();
                    if (!text) return;
                    const now = new Date();
                    this.workerNotes.push({
                        author: this.t('workerNameNoteAuthor'),
                        text,
                        time: now.toLocaleString(this.localeForDates(), { hour12: false })
                    });
                    this.noteDraft = '';
                },

                requestManagerConfirmation() {
                    this.managerConfirmRequested = true;
                },

                initDetail() {
                    const id = new URLSearchParams(location.search).get('id');
                    const base = id && MOCK_JOB_MAP[id] ? MOCK_JOB_MAP[id] : MOCK_JOB_MAP.J001;
                    this.job = { ...base };
                    this.status = base.status;
                    this.resetInspectionPhotos();
                    this.parkingBayNote = base.parkingBayNote != null ? String(base.parkingBayNote) : '';
                    this.washCompletedAt = base.washCompletedAt != null ? String(base.washCompletedAt) : '';
                    this.ackChecked = false;
                },

                goDashboard() {
                    window.location.href = `../dashboard.html?role=${this.role}`;
                }
            };
        }
