<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>创建订单</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.6.1/dist/css/tom-select.default.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.6.1/dist/js/tom-select.complete.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
    <style>
        .header-lang-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
        .header-lang-wrap .lang-dropdown {
            bottom: auto;
            top: calc(100% + 8px);
            left: auto;
            right: 0;
            transform: none;
        }
        .header-lang-btn {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 16px;
            border: none;
            background: transparent;
            color: var(--text-primary);
        }
        .header-lang-btn:hover { background: var(--bg-page); }
    </style>
</head>
<!-- ✅ 数据结构已更新：加入 ownerName 和 ownerPhone -->
<body x-data="createData()" x-init="initCreate()" style="padding-bottom:80px;">
    <div class="header">
        <button class="btn btn-outline" style="width:auto; padding:6px 10px;" @click="goDashboard()">←</button>
        <strong x-text="t('createHeading')"></strong>
        <div class="header-lang-wrap">
            <button type="button"
                    class="header-lang-btn nav-lang-btn"
                    @click="langOpen = !langOpen"
                    :aria-expanded="langOpen">
                🌐
                <svg width="8" height="8" viewBox="0 0 12 12" fill="none" :style="{ transform: langOpen ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.2s' }">
                    <path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
            <div x-show="langOpen"
                 @click.away="langOpen = false"
                 x-transition
                 class="lang-dropdown">
                <button type="button" @click="switchLang('zh'); langOpen = false"
                        class="lang-option"
                        :class="{ 'active': lang === 'zh' }">
                    <span class="lang-flag">🇨🇳</span>
                    <span class="lang-name">中文</span>
                    <span class="lang-code">ZH</span>
                </button>
                <button type="button" @click="switchLang('en'); langOpen = false"
                        class="lang-option"
                        :class="{ 'active': lang === 'en' }">
                    <span class="lang-flag">🇬🇧</span>
                    <span class="lang-name">English</span>
                    <span class="lang-code">EN</span>
                </button>
                <button type="button" @click="switchLang('ms'); langOpen = false"
                        class="lang-option"
                        :class="{ 'active': lang === 'ms' }">
                    <span class="lang-flag">🇲🇾</span>
                    <span class="lang-name">Bahasa Melayu</span>
                    <span class="lang-code">MS</span>
                </button>
            </div>
        </div>
    </div>

    <form @submit.prevent="submitForm()">

        <div class="form-group">
            <label x-text="t('labelServiceDate')"></label>
            <input type="text" x-model="serviceDateTime" class="form-input" readonly style="background:var(--bg-page); cursor:default;">
        </div>

        <div class="form-group">
            <label x-text="t('labelOutlet')"></label>
            <select x-ref="outletSelect" id="outlet-select" required>
                <option value=""></option>
                <option value="puchong">Puchong</option>
                <option value="selayang">Selayang</option>
                <option value="ampang">Ampang</option>
            </select>
        </div>

        <div class="form-group">
            <label x-text="t('labelSalesAdvisor')"></label>
            <select x-ref="salesAdvisorSelect" id="sales-advisor-select" required>
                <option value=""></option>
            </select>
        </div>

        <!-- 联系电话（根据 Sales Advisor 自动带入） -->
        <div class="form-group">
            <label x-text="t('labelOwnerPhone')"></label>
            <input type="tel" x-model="ownerPhone" class="form-input" readonly style="background:var(--bg-page); cursor:default;">
        </div>


        <div class="form-group">
            <label x-text="t('labelVehicleType')"></label>
            <div style="display:flex; gap:16px; margin-bottom:8px;">
                <label style="display:flex; align-items:center; gap:6px; font-size:14px; cursor:pointer;">
                    <input type="radio" name="vehicleType" value="registration" x-model="vehicleType">
                    <span x-text="t('optRegistration')"></span>
                </label>
                <label style="display:flex; align-items:center; gap:6px; font-size:14px; cursor:pointer;">
                    <input type="radio" name="vehicleType" value="chassis" x-model="vehicleType">
                    <span x-text="t('optChassis')"></span>
                </label>
            </div>
            <input type="text"
                   x-model="vehicleIdentifier"
                   class="form-input"
                   :placeholder="vehicleType === 'chassis' ? t('phChassis') : t('phPlate')"
                   required
                   :style="vehicleType === 'registration' ? 'text-transform:uppercase;' : ''">
        </div>

        <div class="form-group">
            <label x-text="t('labelModel')"></label>
            <input type="text" x-model="model" class="form-input" :placeholder="t('phModel')" required>
        </div>

        <div class="form-group">
            <label x-text="t('labelPhotos')"></label>
            <input type="file" accept="image/*" multiple @change="addPhotos($event)" style="font-size:14px;">
            <p style="font-size:12px; color:var(--text-secondary); margin-top:6px;" x-text="t('photosHint')"></p>
            <div x-show="photos.length > 0" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;">
                <template x-for="(p, idx) in photos" :key="p.id">
                    <div style="position:relative; width:64px; height:64px;">
                        <img :src="p.previewUrl" style="width:64px; height:64px; object-fit:cover; border-radius:6px; border:1px solid var(--border);">
                        <button type="button" @click="removePhoto(idx)" style="position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:var(--status-exception); color:white; border:none; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center;">&times;</button>
                    </div>
                </template>
            </div>
        </div>

        <div class="form-group">
            <label x-text="t('labelServices')"></label>

            <label><input type="checkbox" value="1" x-model="services"> 1 - Basic</label>
            <label><input type="checkbox" value="2" x-model="services"> 2 - Premium (water wax)</label>
            <label><input type="checkbox" value="3" x-model="services"> 3 - Headlight Revive &amp; Protect</label>
            <label><input type="checkbox" value="4" x-model="services"> 4 - Engine Revitalize &amp; Shine</label>
            <label><input type="checkbox" value="5" x-model="services"> 5 - Remove Glass Watermark</label>
            <label><input type="checkbox" value="6" x-model="services"> 6 - Glass All Sides Rainaway</label>
            <label><input type="checkbox" value="7" x-model="services"> 7 - Medium Cut Polish &amp; Wax - 1 Layer</label>
            <label><input type="checkbox" value="8" x-model="services"> 8 - Perfect Cut Polish &amp; Wax - 3 Layer</label>
            <label><input type="checkbox" value="9" x-model="services"> 9 - Reblack Plastic</label>
            <label><input type="checkbox" value="10" x-model="services"> 10 - Interior Detail (Dash &amp; Doors)</label>
            <label><input type="checkbox" value="11" x-model="services"> 11 - Nanomist Germ Shield</label>
            <label><input type="checkbox" value="12" x-model="services"> 12 - Leather Seat Conditioner (Leather)</label>
            <label><input type="checkbox" value="13" x-model="services"> 13 - Ceramic 9H</label>
            <label><input type="checkbox" value="14" x-model="services"> 14 - Graphene 10H</label>
            <label><input type="checkbox" value="15" x-model="services"> 15 - Coating Maintenance</label>
        </div>

        <div class="form-group">
            <label x-text="t('labelRemark')"></label>
            <textarea x-model="remark" class="form-textarea" rows="3" :placeholder="t('phRemark')"></textarea>
        </div>

        <button type="submit" class="btn" :disabled="loading" x-text="loading ? t('btnSubmitting') : t('btnSubmit')"></button>
    </form>


    <script>
        function createData() {
            return {
                lang: localStorage.getItem('lang') || 'zh',
                langOpen: false,
                role: new URLSearchParams(location.search).get('role') || 'guest',

                // Sales advisors per outlet with phone (mock — production: fetched from backend)
                salesAdvisorsByOutlet: {
                    puchong: [
                        { name: 'Ali Bin Ahmad', phone: '012-111 2222' },
                        { name: 'Siti Nurhaliza', phone: '012-333 4444' },
                        { name: 'Tan Wei Ming', phone: '012-555 6666' }
                    ],
                    selayang: [
                        { name: 'Raj Kumar', phone: '016-111 2222' },
                        { name: 'Lim Ah Huat', phone: '016-333 4444' },
                        { name: 'Nurul Izzah', phone: '016-555 6666' }
                    ],
                    ampang: [
                        { name: 'David Wong', phone: '011-111 2222' },
                        { name: 'Aisha Binti Yusof', phone: '011-333 4444' },
                        { name: 'Muthu Rajan', phone: '011-555 6666' }
                    ]
                },

                outlet: '',
                salesAdvisor: '',
                vehicleType: 'registration',
                vehicleIdentifier: '',
                plate: '',
                ownerName: '',
                ownerPhone: '',

                model: '',
                photos: [],

                serviceDateTime: '',

                tomOutlet: null,
                tomSalesAdvisor: null,

                services: [],

                remark: '',
                loading: false,

                i18n: {
                    zh: {
                        pageTitle: 'WASHFLOW — 创建订单',
                        createHeading: '创建洗车任务',
                        labelOutlet: '分行 *',
                        phOutlet: '选择分行...',
                        labelServiceDate: '服务日期时间',
                        labelSalesAdvisor: '销售顾问 *',
                        phSalesAdvisor: '选择销售顾问...',
                        labelVehicleType: '车辆类型',
                        optRegistration: 'Registration Number',
                        optChassis: 'New Car - Chassis Number',
                        phChassis: '例: MHKA6GJ2MRJ000123',
                        labelPlate: '车牌号码 *',
                        phPlate: '例: B 1234 ABC',
                        labelOwnerName: '车主姓名 *',
                        phOwnerName: '例: Tan Ah Kow',
                        labelOwnerPhone: '顾问联系电话',
                        phOwnerPhone: '例: 012-345 6789',
                        labelModel: '车型',
                        phModel: '例: Honda City',
                        labelPhotos: '车辆照片',
                        photosHint: '可拍照或上传多张车辆照片',
                        labelServices: '服务项目 *',

                        labelRemark: '备注',
                        phRemark: '客户特殊要求...',
                        btnSubmit: '提交订单',
                        btnSubmitting: '提交中...',
                        alertSelectService: '请选择至少一个服务项目',
                        logSubmitPayload: '提交数据:',
                    },
                    en: {
                        pageTitle: 'WASHFLOW — Create Job',
                        createHeading: 'Create wash job',
                        labelOutlet: 'Outlet *',
                        phOutlet: 'Select outlet...',
                        labelServiceDate: 'Service date & time',
                        labelSalesAdvisor: 'Sales Advisor *',
                        phSalesAdvisor: 'Select sales advisor...',
                        labelVehicleType: 'Vehicle type',
                        optRegistration: 'Registration Number',
                        optChassis: 'New Car - Chassis Number',
                        phChassis: 'e.g. MHKA6GJ2MRJ000123',
                        labelPlate: 'Plate number *',
                        phPlate: 'e.g. B 1234 ABC',
                        labelOwnerName: 'Owner name *',
                        phOwnerName: 'e.g. Tan Ah Kow',
                        labelOwnerPhone: 'Advisor contact',
                        phOwnerPhone: 'e.g. 012-345 6789',
                        labelModel: 'Model',
                        phModel: 'e.g. Honda City',
                        labelPhotos: 'Vehicle photos',
                        photosHint: 'Take or upload vehicle photos',
                        labelServices: 'Services *',

                        labelRemark: 'Notes',
                        phRemark: 'Special requests...',
                        btnSubmit: 'Submit',
                        btnSubmitting: 'Submitting...',
                        alertSelectService: 'Select at least one service.',
                        logSubmitPayload: 'Submit payload:',
                    },
                    ms: {
                        pageTitle: 'WASHFLOW — Cipta Tempahan',
                        createHeading: 'Cipta kerja cuci',
                        labelOutlet: 'Cawangan *',
                        phOutlet: 'Pilih cawangan...',
                        labelServiceDate: 'Tarikh & masa perkhidmatan',
                        labelSalesAdvisor: 'Penasihat Jualan *',
                        phSalesAdvisor: 'Pilih penasihat jualan...',
                        labelVehicleType: 'Jenis kenderaan',
                        optRegistration: 'Registration Number',
                        optChassis: 'New Car - Chassis Number',
                        phChassis: 'cth. MHKA6GJ2MRJ000123',
                        labelPlate: 'Nombor plat *',
                        phPlate: 'cth. B 1234 ABC',
                        labelOwnerName: 'Nama pemilik *',
                        phOwnerName: 'cth. Tan Ah Kow',
                        labelOwnerPhone: 'Telefon penasihat',
                        phOwnerPhone: 'cth. 012-345 6789',
                        labelModel: 'Model',
                        phModel: 'cth. Honda City',
                        labelPhotos: 'Foto kenderaan',
                        photosHint: 'Ambil atau muat naik foto kenderaan',
                        labelServices: 'Perkhidmatan *',

                        labelRemark: 'Catatan',
                        phRemark: 'Permintaan khas...',
                        btnSubmit: 'Hantar',
                        btnSubmitting: 'Menghantar...',
                        alertSelectService: 'Pilih sekurang-kurangnya satu perkhidmatan.',
                        logSubmitPayload: 'Data dihantar:',
                    },
                },

                t(key) {
                    return this.i18n[this.lang]?.[key] || key;
                },

                setLang(lang) {
                    this.lang = lang;
                    localStorage.setItem('lang', lang);
                },

                switchLang(lang) {
                    this.setLang(lang);
                    window.location.reload();
                },

                initCreate() {
                    document.documentElement.lang = this.lang;
                    document.title = this.t('pageTitle');

                    // Set current date & time (readonly) — TODO: replace with GET /api/server-time
                    const now = new Date();
                    this.serviceDateTime = now.toLocaleString(this.lang === 'en' ? 'en-MY' : this.lang === 'ms' ? 'ms-MY' : 'zh-CN', { hour12: false });

                    // Tom Select: Outlet
                    this.tomOutlet = new TomSelect(this.$refs.outletSelect, {
                        placeholder: this.t('phOutlet'),
                        allowEmptyOption: true
                    });
                    this.tomOutlet.on('change', (val) => {
                        this.outlet = val;
                        this.updateSalesAdvisorOptions(val);
                    });

                    // Tom Select: Sales Advisor
                    this.tomSalesAdvisor = new TomSelect(this.$refs.salesAdvisorSelect, {
                        placeholder: this.t('phSalesAdvisor'),
                        allowEmptyOption: true
                    });
                    this.tomSalesAdvisor.on('change', (val) => {
                        this.salesAdvisor = val;
                        // Auto-fill phone from advisor data
                        const advisors = this.salesAdvisorsByOutlet[this.outlet] || [];
                        const found = advisors.find(a => a.name === val);
                        this.ownerPhone = found ? found.phone : '';
                    });
                },

                updateSalesAdvisorOptions(outlet) {
                    this.tomSalesAdvisor.clear();
                    this.tomSalesAdvisor.clearOptions();
                    const advisors = this.salesAdvisorsByOutlet[outlet] || [];
                    advisors.forEach(a => {
                        this.tomSalesAdvisor.addOption({ value: a.name, text: a.name });
                    });
                    this.salesAdvisor = '';
                    this.ownerPhone = '';
                },

                goDashboard() {
                    window.location.href = `../dashboard.html?role=${this.role}`;
                },

                addPhotos(event) {
                    const files = Array.from(event.target.files || []).filter(f => f.type.startsWith('image/'));
                    event.target.value = '';
                    files.forEach(file => {
                        this.photos.push({
                            id: Date.now() + '-' + Math.random().toString(36).slice(2),
                            name: file.name,
                            size: file.size,
                            type: file.type,
                            previewUrl: URL.createObjectURL(file),
                            file
                        });
                    });
                },

                removePhoto(idx) {
                    const item = this.photos[idx];
                    if (item && item.previewUrl) URL.revokeObjectURL(item.previewUrl);
                    this.photos.splice(idx, 1);
                },

                submitForm() {
                    if (this.services.length === 0) {
                        alert(this.t('alertSelectService'));
                        return;
                    }

                    this.loading = true;

                    const payload = {
                        outlet: this.outlet,
                        salesAdvisor: this.salesAdvisor,
                        serviceDateTime: this.serviceDateTime,
                        vehicleType: this.vehicleType,
                        vehicleIdentifier: this.vehicleIdentifier,
                        plate: this.vehicleType === 'registration' ? this.vehicleIdentifier : '',
                        chassisNumber: this.vehicleType === 'chassis' ? this.vehicleIdentifier : '',
                        ownerPhone: this.ownerPhone,
                        model: this.model,
                        photos: this.photos.map(p => ({ name: p.name, size: p.size, type: p.type })),
                        services: this.services,
                        remark: this.remark,
                    };

                    console.log(this.t('logSubmitPayload'), payload);

                    setTimeout(() => {
                        this.goDashboard();
                    }, 600);
                },
            };
        }
    </script>

</body>
</html>
