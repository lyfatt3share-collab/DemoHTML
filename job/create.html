<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>创建订单</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
</head>
<!-- ✅ 数据结构已更新：加入 ownerName 和 ownerPhone -->
<body x-data="createData()" style="padding-bottom:80px;">
    <div class="header">
        <button class="btn btn-outline" style="width:auto; padding:6px 10px;" @click="goDashboard()">←</button>
        <strong>创建洗车任务</strong>
        <div style="width:24px;"></div>
    </div>

    <form @submit.prevent="submitForm()">

        <div class="form-group">
            <label>服务日期 *</label>
            <input type="date" x-model="serviceDate" class="form-input" required>
        </div>


        <div class="form-group">
            <label>Car Dealer（B2B, 可选）</label>
            <input type="text"
                   x-model="dealer"
                   class="form-input"
                   placeholder="例如：Toyota Cheras">
        </div>


        <div class="form-group">
            <label>车牌号码 *</label>
            <input type="text" x-model="plate" class="form-input" placeholder="例: B 1234 ABC" required style="text-transform:uppercase;">
        </div>

        <!-- ✅ 新增：车主姓名 -->
        <div class="form-group">
            <label>车主姓名 *</label>
            <input type="text" x-model="ownerName" class="form-input" placeholder="例: Tan Ah Kow" required>
        </div>

        <!-- ✅ 新增：联系电话 (type="tel" 弹出数字键盘) -->
        <div class="form-group">
            <label>联系电话 *</label>
            <input type="tel" x-model="ownerPhone" class="form-input" placeholder="例: 012-345 6789" required>
        </div>

        <div class="form-group">
            <label>车型 & 颜色</label>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                <input type="text" x-model="model" class="form-input" placeholder="车型" required>
                <input type="text" x-model="color" class="form-input" placeholder="颜色" required>
            </div>
        </div>

        <div class="form-group">
            <label>服务项目 *</label>

            <label><input type="checkbox" value="wash" x-model="services"> 洗车</label>
            <label><input type="checkbox" value="vacuum" x-model="services"> 吸尘</label>
            <label><input type="checkbox" value="wash_vacuum" x-model="services"> 洗车 + 吸尘</label>
            <label><input type="checkbox" value="wax" x-model="services"> 打蜡</label>
            <label><input type="checkbox" value="polish" x-model="services"> Polish / Coating</label>
        </div>

        <div class="form-group">
            <label>备注</label>
            <textarea x-model="remark" class="form-textarea" rows="3" placeholder="客户特殊要求..."></textarea>
        </div>

        <button type="submit" class="btn" :disabled="loading" x-text="loading ? '提交中...' : '提交订单'"></button>
    </form>


    <script>
        function createData() {
            return {
                role: new URLSearchParams(location.search).get('role') || 'guest',

                plate: '',
                ownerName: '',
                ownerPhone: '',

                model: '',
                color: '',

                serviceDate: '',
                dealer: '',

                // ✅ 核心：服务项目 array
                services: [],

                remark: '',
                loading: false,

                goDashboard() {
                    window.location.href = `../dashboard.html?role=${this.role}`
                },

                submitForm() {
                    if (this.services.length === 0) {
                        alert('请选择至少一个服务项目')
                        return
                    }

                    this.loading = true

                    const payload = {
                        plate: this.plate,
                        ownerName: this.ownerName,
                        ownerPhone: this.ownerPhone,

                        model: this.model,
                        color: this.color,

                        serviceDate: this.serviceDate,
                        dealer: this.dealer,

                        services: this.services,
                        remark: this.remark,
                    }

                    console.log('提交数据:', payload)

                    setTimeout(() => {
                        this.goDashboard()
                    }, 600)
                }
            }
        }
    </script>

</body>
</html>
